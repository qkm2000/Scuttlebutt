name: Release

# Cut a release by pushing a version tag that matches manifest.json, e.g.
#   git tag 1.0.5 && git push origin 1.0.5
# CI then builds, attests, and publishes the GitHub release with the three
# plugin assets attached individually (never zipped).
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write       # create the release and upload assets
  id-token: write       # OIDC token used to sign the attestations
  attestations: write   # record build provenance for the assets

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Verify tag matches manifest version
        run: |
          manifest="$(node -p "require('./manifest.json').version")"
          if [ "$GITHUB_REF_NAME" != "$manifest" ]; then
            echo "Tag '$GITHUB_REF_NAME' does not match manifest.json version '$manifest'." >&2
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            main.js manifest.json styles.css
